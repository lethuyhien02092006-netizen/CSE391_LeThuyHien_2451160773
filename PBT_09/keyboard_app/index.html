<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Keyboard & A11y Showcase</h1>
            <p>Press <kbd>Ctrl</kbd> + <kbd>K</kbd> to open command palette</p>
        </div>
    </header>

    <main>
        <section class="gallery-section" aria-label="Image Gallery">
            <div class="gallery-container">
                <div class="main-image-wrapper">
                    <img id="mainImage" src="https://placehold.co/800x400/2563eb/ffffff?text=Image+1" alt="Main gallery image 1" tabindex="0">
                    <div class="play-indicator" id="playIndicator" aria-hidden="true">▶ Auto-playing</div>
                </div>
                
                <div class="gallery-controls">
                    <button id="prevBtn" aria-label="Previous image">← Prev</button>
                    <button id="playBtn" aria-label="Play or pause slideshow">Play (Space)</button>
                    <button id="nextBtn" aria-label="Next image">Next →</button>
                </div>

                <div class="thumbnails" id="thumbnailsContainer" role="tablist" aria-label="Image thumbnails"></div>
                <p class="help-text">Use <kbd>←</kbd> <kbd>→</kbd> to navigate, <kbd>1</kbd>-<kbd>9</kbd> to jump, <kbd>Space</kbd> to play/pause.</p>
            </div>
        </section>
    </main>

    <div id="cmdPaletteOverlay" class="cmd-overlay" role="dialog" aria-modal="true" aria-label="Command Palette" hidden>
        <div class="cmd-palette">
            <div class="cmd-search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="cmdInput" placeholder="Type a command..." aria-autocomplete="list" aria-controls="cmdList">
                <span class="esc-hint"><kbd>Esc</kbd></span>
            </div>
            <ul id="cmdList" class="cmd-list" role="listbox"></ul>
        </div>
    </div>

    <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

    <script src="app.js"></script>
</body>
</html>
