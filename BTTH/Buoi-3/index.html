<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sinh viên</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Quản lý Danh sách Sinh viên</h1>
        <button class="btn btn-primary" id="btnOpenAddModal">Thêm sinh viên mới</button>
    </header>

    <section class="stats-container">
        <div class="stat-card">
            <div class="stat-title">Tổng số sinh viên</div>
            <div class="stat-value" id="totalStudents">0</div>
        </div>
        <div class="stat-card avg">
            <div class="stat-title">Điểm trung bình cả lớp</div>
            <div class="stat-value" id="classAverage">0.0</div>
        </div>
    </section>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>MSSV</th>
                    <th>Họ và tên</th>
                    <th>Ngày sinh</th>
                    <th>Lớp học</th>
                    <th>Điểm TB</th>
                    <th>Email</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
            </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="studentModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Thêm Sinh Viên Mới</h2>
            <span class="close-btn" id="btnCloseModal">&times;</span>
        </div>
        <form id="studentForm">
            <input type="hidden" id="formMode" value="add">
            
            <div class="form-group">
                <label for="studentId">Mã sinh viên *</label>
                <input type="text" id="studentId" class="form-control" required placeholder="Ví dụ: SV001">
            </div>
            <div class="form-group">
                <label for="fullName">Họ và tên *</label>
                <input type="text" id="fullName" class="form-control" required placeholder="Nguyễn Văn A">
            </div>
            <div class="form-group">
                <label for="dob">Ngày sinh *</label>
                <input type="date" id="dob" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="className">Lớp học *</label>
                <input type="text" id="className" class="form-control" required placeholder="Ví dụ: KHMT01">
            </div>
            <div class="form-group">
                <label for="gpa">Điểm trung bình *</label>
                <input type="number" id="gpa" class="form-control" required step="0.1" min="0" max="10" placeholder="Từ 0.0 đến 10.0">
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" class="form-control" required placeholder="example@gmail.com">
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-cancel" id="btnCancelForm">Hủy</button>
                <button type="submit" class="btn btn-primary" id="btnSubmitForm">Lưu dữ liệu</button>
            </div>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
