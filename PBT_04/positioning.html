<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Playground</title>
    <link rel="stylesheet" href="positioning.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">Lê Thúy Hiền</div>
            <div class="nav"><span>Xin chào mọi người</span></div>
        </div>
    </header>
    <div class="container">
        <aside class="sidebar">
            <a href="#" class="active">Tổng quan</a>
            <a href="#">Người dùng</a>
            <a href="#">Cài đặt</a>
        </aside>

        <main class="content">
            <h2>Hệ thống giám sát</h2>
            <div class="stats-grid">
                <div class="card">
                    <span class="badge-hot">HOT</span>
                    <h3>Doanh thu</h3>
                    <p class="value">15,400 $</p>
                </div>
                <div class="card">
                    <h3>Truy cập</h3>
                    <p class="value">2,500</p>
                </div>
            </div>
            <div class="scroll-spacing">Cuộn trang xuống để xem nút Scroll-to-top và kiểm tra thuộc tính Sticky của Sidebar</div>
        </main>
    </div>
    <a href="#" class="scroll-to-top">↑</a>
</body>
</html>
