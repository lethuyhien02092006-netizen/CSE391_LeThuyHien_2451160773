<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap - Trang Quản Trị</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container-fluid">
    <div class="row">

      <!-- Sidebar: nav + grid -->
      <nav class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
        <h5 class="mb-4">Admin</h5>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link text-white active" href="#">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link text-white-50" href="#">Đơn hàng</a></li>
          <li class="nav-item"><a class="nav-link text-white-50" href="#">Sản phẩm</a></li>
          <li class="nav-item"><a class="nav-link text-white-50" href="#">Khách hàng</a></li>
        </ul>
      </nav>

      <!-- Nội dung chính -->
      <main class="col-md-9 col-lg-10 p-4">
        <h1 class="h3 mb-4">Dashboard</h1>

        <!-- Alert -->
        <div class="alert alert-success">Kết nối hệ thống thành công!</div>

        <!-- Card thống kê -->
        <div class="row g-3 mb-4">
          <div class="col-sm-6">
            <div class="card text-bg-primary">
              <div class="card-body">
                <h5 class="card-title">Doanh thu</h5>
                <p class="fs-4 mb-0">184.250k</p>
              </div>
            </div>
          </div>
          <div class="col-sm-6">
            <div class="card text-bg-success">
              <div class="card-body">
                <h5 class="card-title">Đơn hàng mới</h5>
                <p class="fs-4 mb-0">1.248</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Form tìm kiếm -->
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Danh sách đơn hàng</h5>
            <form class="row g-2">
              <div class="col-md-6">
                <input type="text" class="form-control" placeholder="Tìm kiếm...">
              </div>
              <div class="col-md-4">
                <select class="form-select">
                  <option>Tất cả trạng thái</option>
                  <option>Hoàn thành</option>
                  <option>Chờ xử lý</option>
                </select>
              </div>
              <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Lọc</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Bảng dữ liệu -->
        <div class="card">
          <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
              <thead class="table-dark">
                <tr>
                  <th>Mã đơn</th>
                  <th>Khách hàng</th>
                  <th>Tổng tiền</th>
                  <th>Trạng thái</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>#ORD-001</td>
                  <td>Nguyễn Văn A</td>
                  <td>2.850.000đ</td>
                  <td><span class="badge bg-success">Hoàn thành</span></td>
                </tr>
                <tr>
                  <td>#ORD-002</td>
                  <td>Trần Thị B</td>
                  <td>5.990.000đ</td>
                  <td><span class="badge bg-warning text-dark">Chờ xử lý</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

</body>
</html>
